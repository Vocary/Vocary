<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocary Support</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080e1a;
      color: #ffffff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      font-size: 40px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .logo span {
      color: #00c96a;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 16px;
    }

    p {
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      margin-bottom: 24px;
      font-size: 18px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 28px;
      margin: 32px 0;
    }

    .email {
      display: inline-block;
      color: #00c96a;
      font-size: 20px;
      font-weight: 600;
      text-decoration: none;
      margin-top: 8px;
    }

    .email:hover {
      opacity: 0.85;
    }

    .links {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      transition: 0.2s ease;
    }

    .links a:hover {
      color: #00c96a;
    }

    .footer {
      margin-top: 50px;
      color: rgba(255,255,255,0.4);
      font-size: 14px;
    }
  </style>

</head>

<body>
